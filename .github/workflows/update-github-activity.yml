name: Update GitHub Activity Graphs

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graphs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate contribution graphs
        run: python generate_graph.py

      - name: Commit updated graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add contribution-graph.svg contribution-3d.svg

          if git diff --cached --quiet; then
            echo "No graph changes today."
          else
            git commit -m "Update GitHub activity graphs"
            git push
          fi
